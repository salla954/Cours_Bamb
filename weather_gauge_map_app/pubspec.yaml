name: weather_gauge_map_app
description: Application météo temps réel avec jauge animée multi-métriques et carte interactive.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau
  http: ^1.2.0

  # Gestion d'état
  provider: ^6.1.2

  # Carte interactive (OpenStreetMap, gratuit, sans clé API ni facturation)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Jauge de progression animée
  syncfusion_flutter_gauges: ^26.1.35

  # Formatage dates/heures
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
